    <script>
        const WP_API_BASE = 'https://affiliate.creativesd.net/wp-json/wp/v2';
        let currentPage = 1;
        const postsPerPage = 9;

        // 日時フォーマット関数
        function formatDate(dateStr) {
            if (!dateStr) return '';
            const d = new Date(dateStr);
            const y = d.getFullYear();
            const m = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${y}.${m}.${day}`;
        }

        // HTMLタグ除去・プレーンテキスト化
        function stripHtml(html) {
            const tmp = document.createElement('DIV');
            tmp.innerHTML = html;
            return tmp.textContent || tmp.innerText || '';
        }

        // 現在のURLパラメータに応じた画面表示
        function loadCurrentView() {
            const params = new URLSearchParams(window.location.search);
            const postId = params.get('id') || params.get('post');

            document.getElementById('column-loading').classList.remove('hidden');
            document.getElementById('column-error').classList.add('hidden');
            document.getElementById('posts-list-view').classList.add('hidden');
            document.getElementById('single-post-view').classList.add('hidden');

            if (postId) {
                fetchSinglePost(postId);
            } else {
                fetchPosts(currentPage);
            }
        }

        // 記事一覧の取得と描画
        async function fetchPosts(page = 1) {
            currentPage = page;
            try {
                const res = await fetch(`${WP_API_BASE}/posts?_embed&per_page=${postsPerPage}&page=${page}`);
                if (!res.ok) throw new Error('Network response was not ok');

                const totalPages = parseInt(res.headers.get('X-WP-TotalPages') || '1', 10);
                const posts = await res.json();

                renderPostsList(posts, totalPages, page);
            } catch (err) {
                console.error('Fetch posts error:', err);
                document.getElementById('column-loading').classList.add('hidden');
                document.getElementById('column-error').classList.remove('hidden');
            }
        }

        function renderPostsList(posts, totalPages, page) {
            const grid = document.getElementById('posts-grid');
            grid.innerHTML = '';

            if (posts.length === 0) {
                grid.innerHTML = '<div class="col-span-full text-center py-12 text-slate-500">記事がまだありません。</div>';
            } else {
                posts.forEach(post => {
                    const title = post.title && post.title.rendered ? post.title.rendered : '無題';
                    const rawExcerpt = post.excerpt && post.excerpt.rendered ? post.excerpt.rendered : '';
                    const cleanExcerpt = stripHtml(rawExcerpt).slice(0, 90) + '...';
                    const dateFormatted = formatDate(post.date);

                    // アイキャッチ画像の取得
                    let featuredImg = '';
                    if (post._embedded && post._embedded['wp:featuredmedia'] && post._embedded['wp:featuredmedia'][0]) {
                        const media = post._embedded['wp:featuredmedia'][0];
                        featuredImg = media.source_url || '';
                    }

                    // カテゴリーの取得
                    let categoryName = 'コラム';
                    if (post._embedded && post._embedded['wp:term'] && post._embedded['wp:term'][0] && post._embedded['wp:term'][0][0]) {
                        categoryName = post._embedded['wp:term'][0][0].name || 'コラム';
                    }

                    const card = document.createElement('article');
                    card.className = 'bg-white rounded-3xl border border-slate-200/90 shadow-sm hover:shadow-xl transition-all duration-300 overflow-hidden flex flex-col justify-between group cursor-pointer transform hover:-translate-y-1';
                    card.onclick = () => navigateToPost(post.id);

                    const imgHtml = featuredImg 
                        ? `<div class="w-full h-48 overflow-hidden bg-slate-100"><img src="${featuredImg}" alt="${title}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500"></div>`
                        : `<div class="w-full h-44 bg-gradient-to-br from-slate-800 via-blue-950 to-slate-900 flex items-center justify-center p-6 text-center relative overflow-hidden">
                             <div class="absolute inset-0 bg-cyan-500/10"></div>
                             <span class="text-cyan-300 font-bold text-sm tracking-wider uppercase z-10 flex items-center gap-2"><i class="fas fa-file-alt"></i> CSD COLUMN</span>
                           </div>`;

                    card.innerHTML = `
                        <div>
                            ${imgHtml}
                            <div class="p-6 sm:p-7 space-y-3">
                                <div class="flex items-center justify-between text-xs text-slate-500">
                                    <span class="px-2.5 py-0.5 rounded-full bg-cyan-50 text-cyan-700 font-semibold border border-cyan-100">${categoryName}</span>
                                    <time class="flex items-center gap-1"><i class="far fa-calendar-alt text-slate-400"></i> ${dateFormatted}</time>
                                </div>
                                <h2 class="text-lg font-bold text-slate-900 group-hover:text-secondary transition-colors leading-snug line-clamp-2">
                                    ${title}
                                </h2>
                                <p class="text-xs sm:text-sm text-slate-600 leading-relaxed line-clamp-3">
                                    ${cleanExcerpt}
                                </p>
                            </div>
                        </div>
                        <div class="px-6 pb-6 pt-0 flex items-center text-xs font-bold text-secondary group-hover:translate-x-1 transition-transform">
                            <span>続きを読む</span>
                            <i class="fas fa-arrow-right ml-1.5 text-[10px]"></i>
                        </div>
                    `;
                    grid.appendChild(card);
                });
            }

            // ページネーション描画
            renderPagination(totalPages, page);

            document.getElementById('column-loading').classList.add('hidden');
            document.getElementById('posts-list-view').classList.remove('hidden');
        }

        function renderPagination(totalPages, current) {
            const container = document.getElementById('pagination');
            container.innerHTML = '';

            if (totalPages <= 1) {
                container.classList.add('hidden');
                return;
            }

            container.classList.remove('hidden');

            // 前へボタン
            if (current > 1) {
                const prevBtn = document.createElement('button');
                prevBtn.className = 'w-10 h-10 rounded-full border border-slate-200 bg-white hover:bg-slate-100 flex items-center justify-center text-slate-700 font-bold transition-colors';
                prevBtn.innerHTML = '<i class="fas fa-chevron-left text-xs"></i>';
                prevBtn.onclick = () => { window.scrollTo({ top: 0, behavior: 'smooth' }); fetchPosts(current - 1); };
                container.appendChild(prevBtn);
            }

            // ページ番号
            for (let i = 1; i <= totalPages; i++) {
                const pageBtn = document.createElement('button');
                const isActive = i === current;
                pageBtn.className = `w-10 h-10 rounded-full font-bold text-sm transition-all ${
                    isActive 
                        ? 'bg-secondary text-white shadow-md' 
                        : 'border border-slate-200 bg-white hover:bg-slate-100 text-slate-700'
                }`;
                pageBtn.innerText = i;
                pageBtn.onclick = () => { window.scrollTo({ top: 0, behavior: 'smooth' }); fetchPosts(i); };
                container.appendChild(pageBtn);
            }

            // 次へボタン
            if (current < totalPages) {
                const nextBtn = document.createElement('button');
                nextBtn.className = 'w-10 h-10 rounded-full border border-slate-200 bg-white hover:bg-slate-100 flex items-center justify-center text-slate-700 font-bold transition-colors';
                nextBtn.innerHTML = '<i class="fas fa-chevron-right text-xs"></i>';
                nextBtn.onclick = () => { window.scrollTo({ top: 0, behavior: 'smooth' }); fetchPosts(current + 1); };
                container.appendChild(nextBtn);
            }
        }

        // 個別記事の取得と描画
        async function fetchSinglePost(id) {
            try {
                const res = await fetch(`${WP_API_BASE}/posts/${id}?_embed`);
                if (!res.ok) throw new Error('Post not found');

                const post = await res.json();
                renderSinglePost(post);
            } catch (err) {
                console.error('Fetch single post error:', err);
                document.getElementById('column-loading').classList.add('hidden');
                document.getElementById('column-error').classList.remove('hidden');
            }
        }

        function renderSinglePost(post) {
            const title = post.title && post.title.rendered ? post.title.rendered : '無題';
            const content = post.content && post.content.rendered ? post.content.rendered : '';
            const dateFormatted = formatDate(post.date);

            document.title = `${stripHtml(title)} | Creative System Design コラム`;

            document.getElementById('single-title').innerHTML = title;
            document.getElementById('single-date').querySelector('time').textContent = dateFormatted;

            // カテゴリー
            let categoryName = 'コラム';
            if (post._embedded && post._embedded['wp:term'] && post._embedded['wp:term'][0] && post._embedded['wp:term'][0][0]) {
                categoryName = post._embedded['wp:term'][0][0].name || 'コラム';
            }
            document.getElementById('single-category').textContent = categoryName;

            // アイキャッチ画像
            const imgWrapper = document.getElementById('single-featured-image-wrapper');
            const imgElem = document.getElementById('single-featured-image');
            if (post._embedded && post._embedded['wp:featuredmedia'] && post._embedded['wp:featuredmedia'][0]) {
                imgElem.src = post._embedded['wp:featuredmedia'][0].source_url;
                imgElem.alt = title;
                imgWrapper.classList.remove('hidden');
            } else {
                imgWrapper.classList.add('hidden');
            }

            // 本文
            document.getElementById('single-body').innerHTML = content;

            document.getElementById('column-loading').classList.add('hidden');
            document.getElementById('single-post-view').classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // ナビゲーション制御
        function navigateToPost(id) {
            history.pushState({ postId: id }, '', `column.html?id=${id}`);
            loadCurrentView();
        }

        function navigateToList() {
            history.pushState(null, '', 'column.html');
            document.title = '教育現場のお役立ちコラム・ICT情報 | Creative System Design';
            loadCurrentView();
        }

        // ブラウザの戻る・進むボタンへの対応
        window.addEventListener('popstate', () => {
            loadCurrentView();
        });

        // 初期実行
        document.addEventListener('DOMContentLoaded', () => {
            loadCurrentView();
        });
    </script>
</body>
</html>
