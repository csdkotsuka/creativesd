<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="grad-tennis-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#0a4d3c" />
      <stop offset="100%" stop-color="#14532d" />
    </linearGradient>
    <linearGradient id="grad-ball" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#ccfbf1" />
      <stop offset="60%" stop-color="#84cc16" />
      <stop offset="100%" stop-color="#65a30d" />
    </linearGradient>
    <linearGradient id="grad-tennis-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
    <filter id="shadow-tennis" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#022c22" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background with rounded corners -->
  <rect width="120" height="120" rx="28" fill="url(#grad-tennis-bg)" />
  <rect x="1" y="1" width="118" height="118" rx="27" fill="none" stroke="#6ee7b7" stroke-width="1.5" stroke-opacity="0.3" />

  <!-- Court baseline / service box subtle white lines -->
  <line x1="24" y1="60" x2="96" y2="60" stroke="#ffffff" stroke-width="1.2" stroke-opacity="0.15" />
  <line x1="60" y1="24" x2="60" y2="96" stroke="#ffffff" stroke-width="1.2" stroke-opacity="0.15" />
  <rect x="30" y="30" width="60" height="60" fill="none" stroke="#ffffff" stroke-width="1.2" stroke-opacity="0.12" />

  <g transform="translate(60, 60)" filter="url(#shadow-tennis)">
    <!-- Crossed Rackets Silhouette in Gold/White -->
    <!-- Racket 1 (Left to Right /) -->
    <g transform="rotate(-30)">
      <!-- Handle -->
      <line x1="0" y1="12" x2="0" y2="34" stroke="#d4af37" stroke-width="3" stroke-linecap="round" />
      <rect x="-2" y="24" width="4" height="10" rx="1.5" fill="#f8fafc" />
      <!-- Head -->
      <ellipse cx="0" cy="-6" rx="14" ry="18" fill="none" stroke="#fef08a" stroke-width="2.5" />
      <!-- Strings -->
      <line x1="-8" y1="-6" x2="8" y2="-6" stroke="#fef9c3" stroke-width="0.8" opacity="0.6" />
      <line x1="-10" y1="-1" x2="10" y2="-1" stroke="#fef9c3" stroke-width="0.8" opacity="0.6" />
      <line x1="-10" y1="-11" x2="10" y2="-11" stroke="#fef9c3" stroke-width="0.8" opacity="0.6" />
      <line x1="-4" y1="-20" x2="-4" y2="8" stroke="#fef9c3" stroke-width="0.8" opacity="0.6" />
      <line x1="4" y1="-20" x2="4" y2="8" stroke="#fef9c3" stroke-width="0.8" opacity="0.6" />
    </g>

    <!-- Racket 2 (Right to Left \) -->
    <g transform="rotate(30)">
      <!-- Handle -->
      <line x1="0" y1="12" x2="0" y2="34" stroke="#ca8a04" stroke-width="3" stroke-linecap="round" />
      <rect x="-2" y="24" width="4" height="10" rx="1.5" fill="#f8fafc" />
      <!-- Head -->
      <ellipse cx="0" cy="-6" rx="14" ry="18" fill="none" stroke="#facc15" stroke-width="2.5" />
      <!-- Strings -->
      <line x1="-8" y1="-6" x2="8" y2="-6" stroke="#fef9c3" stroke-width="0.8" opacity="0.6" />
      <line x1="-10" y1="-1" x2="10" y2="-1" stroke="#fef9c3" stroke-width="0.8" opacity="0.6" />
      <line x1="-10" y1="-11" x2="10" y2="-11" stroke="#fef9c3" stroke-width="0.8" opacity="0.6" />
      <line x1="-4" y1="-20" x2="-4" y2="8" stroke="#fef9c3" stroke-width="0.8" opacity="0.6" />
      <line x1="4" y1="-20" x2="4" y2="8" stroke="#fef9c3" stroke-width="0.8" opacity="0.6" />
    </g>

    <!-- Front & Center: Official Glowing Tennis Ball -->
    <g transform="translate(0, 0)">
      <!-- Ball base -->
      <circle cx="0" cy="0" r="14" fill="url(#grad-ball)" stroke="#ffffff" stroke-width="1.8" />
      <!-- Curved Tennis Seams (white seam lines) -->
      <path d="M -10 -9 C -4 -4, -4 4, -10 9" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" />
      <path d="M 10 -9 C 4 -4, 4 4, 10 9" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" />
    </g>

    <!-- Grand Slam Gold Star at Top -->
    <g transform="translate(0, -26) scale(0.9)">
      <path d="M 0 -7 L 2 -2 L 7 -2 L 3 1 L 5 6 L 0 3 L -5 6 L -3 1 L -7 -2 L -2 -2 Z" fill="url(#grad-tennis-gold)" />
    </g>
  </g>
</svg>
