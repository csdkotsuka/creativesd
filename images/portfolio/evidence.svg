<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="grad-evidence-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e" />
      <stop offset="50%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="grad-shield" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#ccfbf1" />
    </linearGradient>
    <filter id="shadow-evidence" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#042f2e" flood-opacity="0.3" />
    </filter>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="120" height="120" rx="28" fill="url(#grad-evidence-bg)" />
  <rect x="1" y="1" width="118" height="118" rx="27" fill="none" stroke="#5eead4" stroke-width="1.5" stroke-opacity="0.4" />
  
  <!-- Subtle scientific grid / orbital rings -->
  <circle cx="60" cy="60" r="42" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.12" stroke-dasharray="3 3" />
  <circle cx="60" cy="60" r="28" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.15" />

  <!-- Shield & Medical / Science DNA Checkmark Icon -->
  <g transform="translate(60, 58)" filter="url(#shadow-evidence)">
    <!-- Shield Outline -->
    <path d="M 0 -28 L 24 -18 C 24 6, 16 24, 0 32 C -16 24, -24 6, -24 -18 Z" 
          fill="none" stroke="url(#grad-shield)" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" />
    
    <!-- Central Science / DNA Molecule nodes -->
    <circle cx="-10" cy="-10" r="3.5" fill="#ffffff" />
    <circle cx="10" cy="-6" r="3.5" fill="#a7f3d0" />
    <circle cx="-8" cy="6" r="3.5" fill="#a7f3d0" />
    <circle cx="9" cy="10" r="3.5" fill="#ffffff" />
    
    <!-- Connecting strands -->
    <line x1="-10" y1="-10" x2="10" y2="-6" stroke="#ffffff" stroke-width="2" stroke-opacity="0.8" />
    <line x1="-10" y1="-10" x2="-8" y2="6" stroke="#ffffff" stroke-width="2" stroke-opacity="0.6" />
    <line x1="10" y1="-6" x2="9" y2="10" stroke="#ffffff" stroke-width="2" stroke-opacity="0.6" />
    <line x1="-8" y1="6" x2="9" y2="10" stroke="#ffffff" stroke-width="2" stroke-opacity="0.8" />

    <!-- Central Verified Badge / Sparkle at bottom -->
    <path d="M 0 16 L 2 21 L 7 21 L 3 24 L 5 29 L 0 26 L -5 29 L -3 24 L -7 21 L -2 21 Z" fill="#fef08a" />
  </g>
</svg>
