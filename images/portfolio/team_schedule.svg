<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="grad-calendar-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>
    <linearGradient id="grad-white-soft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f0fdf4" />
    </linearGradient>
    <filter id="shadow-cal" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#064e3b" flood-opacity="0.3" />
    </filter>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="120" height="120" rx="28" fill="url(#grad-calendar-bg)" />
  <rect x="1" y="1" width="118" height="118" rx="27" fill="none" stroke="#6ee7b7" stroke-width="1.5" stroke-opacity="0.3" />

  <!-- Calendar Base -->
  <g transform="translate(60, 62) scale(0.95)" filter="url(#shadow-cal)">
    <!-- Calendar Body -->
    <rect x="-32" y="-28" width="64" height="60" rx="12" fill="url(#grad-white-soft)" />
    
    <!-- Calendar Header (Green top) -->
    <path d="M -32 -16 L -32 -20 C -32 -24.4, -28.4 -28, -24 -28 L 24 -28 C 28.4 -28, 32 -24.4, 32 -20 L 32 -16 Z" fill="#047857" />
    
    <!-- Calendar Binder Rings -->
    <rect x="-18" y="-33" width="5" height="10" rx="2.5" fill="#f8fafc" stroke="#047857" stroke-width="1.5" />
    <rect x="13" y="-33" width="5" height="10" rx="2.5" fill="#f8fafc" stroke="#047857" stroke-width="1.5" />

    <!-- Calendar Grid Dots / Sync Icon -->
    <circle cx="-16" cy="-4" r="3" fill="#10b981" />
    <circle cx="0" cy="-4" r="3" fill="#10b981" />
    <circle cx="16" cy="-4" r="3" fill="#10b981" />

    <circle cx="-16" cy="8" r="3" fill="#10b981" />
    <circle cx="0" cy="8" r="3.5" fill="#f59e0b" />
    <circle cx="16" cy="8" r="3" fill="#10b981" />

    <!-- Checkmark Badge on bottom-right -->
    <g transform="translate(18, 18)">
      <circle cx="0" cy="0" r="10" fill="#10b981" stroke="#ffffff" stroke-width="2" />
      <path d="M -4 -0.5 L -1 2.5 L 4 -2.5" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <!-- Sync arrows at bottom-left -->
    <g transform="translate(-16, 19) scale(0.85)">
      <path d="M -5 0 A 5 5 0 0 1 3 -4 L 4 -1 L 0 -1" fill="none" stroke="#0d9488" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M 5 0 A 5 5 0 0 1 -3 4 L -4 1 L 0 1" fill="none" stroke="#0d9488" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
    </g>
  </g>
</svg>
