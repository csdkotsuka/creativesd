<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="vkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0.9" />
    </linearGradient>
  </defs>
  
  <!-- App Icon Background -->
  <rect width="512" height="512" rx="140" fill="url(#vkGrad)" />

  <!-- Subtle Circular Soundwave Radar Rings -->
  <circle cx="256" cy="225" r="175" fill="none" stroke="#bae6fd" stroke-width="5" stroke-dasharray="8 8" opacity="0.35" />
  <circle cx="256" cy="225" r="140" fill="none" stroke="#bae6fd" stroke-width="6" opacity="0.45" />

  <!-- Left & Right Dynamic Audio Sound Waves -->
  <!-- Left Waves -->
  <line x1="90" y1="225" x2="90" y2="225" stroke="#ffffff" stroke-width="16" stroke-linecap="round" opacity="0.6" />
  <line x1="120" y1="200" x2="120" y2="250" stroke="#ffffff" stroke-width="16" stroke-linecap="round" opacity="0.8" />
  <line x1="150" y1="175" x2="150" y2="275" stroke="#ffffff" stroke-width="16" stroke-linecap="round" opacity="0.95" />

  <!-- Right Waves -->
  <line x1="362" y1="175" x2="362" y2="275" stroke="#ffffff" stroke-width="16" stroke-linecap="round" opacity="0.95" />
  <line x1="392" y1="200" x2="392" y2="250" stroke="#ffffff" stroke-width="16" stroke-linecap="round" opacity="0.8" />
  <line x1="422" y1="225" x2="422" y2="225" stroke="#ffffff" stroke-width="16" stroke-linecap="round" opacity="0.6" />

  <!-- Central Medical Microphone Symbol -->
  <!-- Microphone Capsule -->
  <rect x="216" y="135" width="80" height="150" rx="40" fill="#ffffff" />
  <!-- Capsule Accent Lines (Sound grid detail) -->
  <line x1="236" y1="175" x2="276" y2="175" stroke="#0284c7" stroke-width="6" stroke-linecap="round" opacity="0.75" />
  <line x1="236" y1="200" x2="276" y2="200" stroke="#0284c7" stroke-width="6" stroke-linecap="round" opacity="0.75" />
  <line x1="236" y1="225" x2="276" y2="225" stroke="#0284c7" stroke-width="6" stroke-linecap="round" opacity="0.75" />

  <!-- Microphone U-Cradle Pickup Arc -->
  <path d="M 186 220 C 186 300, 326 300, 326 220" fill="none" stroke="#ffffff" stroke-width="22" stroke-linecap="round" />

  <!-- Stand Vertical Pole -->
  <line x1="256" y1="298" x2="256" y2="365" stroke="#ffffff" stroke-width="22" stroke-linecap="round" />

  <!-- Stand Base Pedestal -->
  <line x1="196" y1="365" x2="316" y2="365" stroke="#ffffff" stroke-width="22" stroke-linecap="round" />

  <!-- Medical Cross Badge Indicator (Bottom Center Accent) -->
  <circle cx="256" cy="415" r="22" fill="#ffffff" />
  <rect x="252" y="401" width="8" height="28" rx="4" fill="#0d9488" />
  <rect x="242" y="411" width="28" height="8" rx="4" fill="#0d9488" />
</svg>
